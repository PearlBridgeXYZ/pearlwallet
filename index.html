<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Mirror the CSP in public/_headers so non-Cloudflare deployments
      (local static servers, IPFS, S3-backed mirrors, etc.) still enforce
      connect-src against the trusted RPC allowlist. _headers is kept for
      defense in depth — frame-ancestors / HSTS / Permissions-Policy
      can't be set from a <meta> tag and stay on the response header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://rpc.pearlwallet.xyz https://ethereum-rpc.publicnode.com https://eth.drpc.org https://pearlbridge.xyz; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#1f2940" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PearlWallet</title>
    <meta name="description" content="PearlWallet — non-custodial browser wallet for Pearl L1 and WPRL with native PearlBridge integration. Open source. Your keys, your browser, your funds." />
  </head>
  <body class="bg-ink-50 text-ink-900 antialiased dark:bg-ink-950 dark:text-ink-100">
    <!--
      Iframe bust. CSP `frame-ancestors` lives in public/_headers (the
      Cloudflare deploy enforces it) but a non-CF mirror — local static
      server, IPFS gateway, S3 bucket — would not serve those headers
      and a malicious page could embed pearlwallet.xyz in a hidden iframe
      to overlay/click-jack the unlock or send confirm. Inline so it
      runs before main.tsx mounts React; throws to halt further script
      evaluation in the framed context.
    -->
    <script>
      (function () {
        try {
          if (window.top !== window.self) {
            document.documentElement.innerHTML =
              '<body style="background:#fff;color:#111;font-family:system-ui,sans-serif;padding:2rem"><h1 style="font-size:18px">PearlWallet cannot run inside an iframe.</h1><p style="font-size:14px">Open <a href="https://pearlwallet.xyz">pearlwallet.xyz</a> directly in a new tab.</p></body>';
            throw new Error("PearlWallet refused to run framed");
          }
        } catch (e) {
          // Cross-origin access to window.top throws SecurityError —
          // that itself proves we're framed. Same response as above.
          if (e && (e.name === "SecurityError" || /framed/.test(String(e.message)))) {
            document.documentElement.innerHTML =
              '<body style="background:#fff;color:#111;font-family:system-ui,sans-serif;padding:2rem"><h1 style="font-size:18px">PearlWallet cannot run inside an iframe.</h1></body>';
            throw e;
          }
        }
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        PearlWallet needs JavaScript. Enable it and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
